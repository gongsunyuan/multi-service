# ==============================================================================
# (Validation Parameters)
# ==============================================================================
EVALUATING:
  VALIDATION_LOAD: 60.0
  VALIDATION_EPISODES_PER_FLOW: 120
  VALIDATION_BATCH_SIZE: 10
  VALIDATION_FLOW_TYPES:
    - "VOIP"      # 测延迟
    - "GAMING"    # 测综合
    - "STREAMING" # 测带宽

  ENTROPY_COEF: 0.0
  EPSILON: 0.0

# ==============================================================================
# 模型结构参数 (必须与训练时一致，否则 load_state_dict 报错)
# ==============================================================================
# 请根据你 best_agent.pth 训练时的设置修改这里：
MODEL:
  GNN_DIM: 256
  LSTM_DIM: 128
  GNN_LAYERS: 6
  GNN_NODE_DIM: 10  # 特征维度要对齐

ENV:
  MAX_NODES_NUM: 14
  MIN_DELAY: 1.0
  MAX_DELAY: 200.0
  MIN_BW: 30
  MAX_BW: 200.0
  MAX_LOSS: 5.0

PATHS:
  PRETRAINED_DIR: "data/weights"
  PRETRAINED_LSTM: "trained_lstm.pth"
  PRETRAINED_GNN: "trained_gnn_recall_ospf.pth"
  PRETRAINED_MM1: None

  FINGERPRINT_BANK: "data/fingerprints/fingerprint_bank.pt"
  TOPOLOGY_FILE: "nsfnet_gravity.graphml"
  CHECKPOINT_DIR: "workspace/checkpoints/sdn/"
  FINALMODEL_DIR: "workspace/finalmodels/sdn/"
  TOPOLOGIES_DIR: "data/topologies/"
  LOG_DIR: "workspace/logs/"