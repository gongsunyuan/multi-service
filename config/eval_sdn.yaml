# config.yaml

# --- Project Paths ---
PATHS:
  PRETRAINED_DIR: "data/weights"
  PRETRAINED_LSTM: "trained_lstm.pth"
  PRETRAINED_GNN: "trained_gnn_recall_ospf.pth"
  PRETRAINED_MM1: None
  FINGERPRINT_BANK: "data/fingerprints/fingerprint_bank.pt"
  TOPOLOGY_FILE: "nsfnet_gravity.graphml"
  CHECKPOINT_DIR: "workspace/checkpoints/sdn/"
  FINALMODEL_DIR: "workspace/finalmodels/sdn/"
  TOPOLOGIES_DIR: "data/topologies/"
  LOG_DIR: "workspace/logs/"
# --- Model Dimensions ---
MODEL:
  GNN_DIM: 256
  LSTM_DIM: 128
  GNN_LAYERS: 6
  N_PACKETS: 30

# --- Training Hyperparameters ---
TRAINING:
  EPOCH: 60
  EPISODES_PER_TOPO: 32
  BATCH_SIZE: 32
  ENTROPY_COEF: 0.01
  LR_HEADS: 1.0e-4
  LR_GNN_BODY: 1.0e-7
  GAMMA: 0.99
  CRITIC_LOSS_COEF: 0.5
  MAX_GRAD_NORM: 0.5
  START_LOAD: 60
  END_LOAD: 150

# --- Environment & QoS Constraints ---
ENV:
  MAX_NODES_NUM: 10
  MIN_DELAY: 1.0
  MAX_DELAY: 200.0
  MIN_BW: 30
  MAX_BW: 200
  MAX_LOSS: 5.0

