# 路径配置
name:
  exp_name: "nsfnet_ppo_train"
path:
  graph_path: "data/topologies/nsfnet_gravity.graphml"
  fgprt_path: "data/fingerprints/fingerprint_bank.pt"
  output_dir: "workspace/outputs/ppo_train"

# 网络架构
model:
  edge_dim: 4
  node_dim: 9
  gnn_heads: 4
  gnn_layers: 6
  hidden_dim: 128
  fingerprint_dim: 2

# 训练参数
train:
  lr: 0.0004
  clip_eps: 0.2
  max_steps: 20
  batch_size: 16
  ppo_epochs: 10
  max_epochs: 2000
  save_interval: 2
  entropy_coef: 0.01
  checkpoint_keep_count: 2

# 环境与背景流
env:
  max_loss: 5.0
  bg_duration: 600

  min_bw: 30
  max_bw: 200.0
  min_delay: 1.0
  max_delay: 200.0
  max_nodes_num: 20
  bg_cookie: 0xB000
  flow_cookie: 0xA000

  total_load_mbps: 200.0
  start_load: 20.0      
  end_load: 200.0        

  curriculum: true       

# QoS 奖励参数
qos_reward:
  penalty_dead_end: -5
  GAMING:
    ref_bw: 0.5
    max_delay: 80.0
    max_jitter: 20.0
    w: [0.4, 0.1, 0.4, 0.1]
  VOIP:
    ref_bw: 0.1
    max_delay: 150.0
    max_jitter: 50.0
    w: [0.3, 0.2, 0.4, 0.1]
  STREAMING:
    ref_bw: 5.0
    max_delay: 1000.0
    max_jitter: 100.0
    w: [0.1, 0.1, 0.3, 0.5]
  DEFAULT:
    ref_bw: 5.0
    max_delay: 200.0
    max_jitter: 100.0
    w: [0.25, 0.25, 0.25, 0.25]