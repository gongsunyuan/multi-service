full:
  _target_: multi_service.agents.film_agent.FiLMAgent
  node_dim: ${model_hyperparamters.node_dim}
  edge_dim: ${model_hyperparamters.edge_dim}
  hidden_dim: ${model_hyperparamters.hidden_dim}
  fingerprint_dim: ${model_hyperparamters.fingerprint_dim}
  gnn_layers: ${model_hyperparamters.gnn_layers}
  gnn_heads: ${model_hyperparamters.gnn_heads}
  dropout: ${model_hyperparamters.dropout}

  film_lr: ${train_hyperparameters.film_lr}
  gnn_lr: ${train_hyperparameters.gnn_lr}

  clip_eps: ${train_hyperparameters.clip_eps}
  ppo_epochs: ${train_hyperparameters.ppo_epochs}
  entropy_coef: ${train_hyperparameters.entropy_coef}
  weight_decay: ${train_hyperparameters.weight_decay}

  device_name: ${device}

gnn:
  _target_: multi_service.agents.gnn_agent.GnnAgent
  node_dim: ${model_hyperparamters.node_dim}
  edge_dim: ${model_hyperparamters.edge_dim}
  hidden_dim: ${model_hyperparamters.hidden_dim}
  gnn_layers: ${model_hyperparamters.gnn_layers}
  gnn_heads: ${model_hyperparamters.gnn_heads}
  dropout: ${model_hyperparamters.dropout}
  lr: ${train_hyperparameters.gnn_lr}
  clip_eps: ${train_hyperparameters.clip_eps}
  ppo_epochs: ${train_hyperparameters.ppo_epochs}
  entropy_coef: ${train_hyperparameters.entropy_coef}
  device_name: ${device}

drl:
  _target_: multi_service.agents.drl_agent.DrlAgent
  node_dim: ${model_hyperparamters.node_dim}
  edge_dim: ${model_hyperparamters.edge_dim}
  hidden_dim: ${model_hyperparamters.hidden_dim}
  lr: ${train_hyperparameters.gnn_lr}
  clip_eps: ${train_hyperparameters.clip_eps}
  ppo_epochs: ${train_hyperparameters.ppo_epochs}
  entropy_coef: ${train_hyperparameters.entropy_coef}
  weight_decay: ${train_hyperparameters.weight_decay}
  device_name: ${device}

fgprt_bank: 
  _target_: multi_service.utils.BankTrafficManager
  src_nodes: ${env.wrapper.src_nodes}
  dst_nodes: ${env.wrapper.dst_nodes}
  fgpt_path: ${path.fgpt_path}