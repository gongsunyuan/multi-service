defaults:
  - hydra: info 
  - components: default
  - env: theore
  - _self_

name: "model_test"

seed: 42
device: cuda:0
datestamp: ${now:%Y_%m%d}
timestamp: ${now:%H%M_%S}

test:
  num_flows: 300
  
path:
  data: /home/gsy/multi-service/data

  topo_path: ${path.data}/topologies/${env.topo.name}
  fgpt_path: ${path.data}/fingerprints/fingerprint_bank.pt 
  output_dir: "${hydra:runtime.output_dir}"
  weight_dir: "${path.data}/weight/"

new_dir:
  tensorboard_dir: ${path.output_dir}/tensorboard/
  eval_dir: ${path.output_dir}/eval/
  
new_file:
  config_file: ${path.output_dir}/config.yaml
  debug_file: ${path.output_dir}/debug.log
  trace_file: ${path.output_dir}/trace.log

# 网络架构
model_hyperparamters:
  node_dim: 2
  edge_dim: 3
  gnn_heads: 3
  gnn_layers: 4
  hidden_dim: 256
  fingerprint_dim: 2
  dropout: 0
  
# 训练参数
train_hyperparameters:
  film_lr: 0.04
  gnn_lr: 0.0004
  weight_decay: 0
  clip_eps: 0.2
  max_steps: 20
  batch_size: 30
  ppo_epochs: 10
  max_epochs: 200
  save_interval: 2
  entropy_coef: 0.1
  checkpoint_keep_count: 2

# QoS 奖励参数
qos_reward:
  delay_sigma: 50.0
  loss_sigma: 8
  penalty_dead_end: -2
  VOIP:
    min_delay: 10.0
    max_delay: 200.0
    w: [1, 0] # [delay, loss_rate]
  STREAMING:
    min_delay: 10.0
    max_delay: 200.0
    w: [0.01, 0.99] # [delay, loss_rate]
