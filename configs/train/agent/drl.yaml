name: "drl"

model:
  _target_: multi_service.agents.drl_agent.DrlAgent
  node_dim: ${model_hyperparamters.node_dim}
  edge_dim: ${model_hyperparamters.edge_dim}
  hidden_dim: ${model_hyperparamters.hidden_dim}
  lr: ${train_hyperparameters.gnn_lr}
  clip_eps: ${train_hyperparameters.clip_eps}
  ppo_epochs: ${train_hyperparameters.ppo_epochs}
  entropy_coef: ${train_hyperparameters.entropy_coef}
  weight_decay: ${train_hyperparameters.weight_decay}
  device_name: ${device}
