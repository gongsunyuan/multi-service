name:
  exp_name: "lstm_pre_train"
path:
  fgprt_path: "data/fingerprints/fingerprint_bank.pt"
  output_dir: "workspace/outputs/lstm_pre_train"

debug_mode: false

# 网络架构
model:
  edge_dim: 4
  node_dim: 9
  gnn_heads: 4
  gnn_layers: 6
  hidden_dim: 128
  fingerprint_dim: 2
  
  ablation_mode: "full" # 'full', 'vanilla_gnn', 'film_drl', 'vanilla_drl'

train:
  lr: 0.004
  epochs: 200
  batch_size: 32
  weight_decay: 0.0001

env:
  src_nodes: [0,]
  dst_nodes: [13,]